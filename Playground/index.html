<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
		<meta name="color-scheme" content="light dark">
		<title>NUI Component Playground</title>
		<link rel="stylesheet" href="../NUI/css/nui-theme.css">
		<link rel="stylesheet" href="../NUI/css/modules/nui-syntax-highlight.css">
		<link rel="stylesheet" href="../NUI/css/modules/nui-menu.css">
		<link rel="stylesheet" href="../NUI/css/modules/nui-context-menu.css">
		<link rel="stylesheet" href="../NUI/css/modules/nui-app-window.css">
		<link rel="stylesheet" href="../NUI/css/modules/nui-list.css">
		<link rel="stylesheet" href="../NUI/css/modules/nui-lightbox.css">
		<link rel="stylesheet" href="../NUI/css/modules/nui-code-editor.css">
		<link rel="stylesheet" href="../NUI/css/modules/nui-media-player.css">
		<link rel="stylesheet" href="../NUI/css/modules/nui-wizard.css">
		<link rel="stylesheet" href="../NUI/css/modules/nui-graph.css">
		<link rel="stylesheet" href="../NUI/css/modules/nui-slides.css">

		<link rel="stylesheet" href="../NUI/css/modules/nui-debug.css">
		<link rel="stylesheet" href="../NUI/css/modules/nui-rich-text.css">
		<link rel="stylesheet" href="../NUI/css/modules/nui-blocks-editor.css">
		<link rel="stylesheet" href="../NUI/css/modules/nui-notepad.css">
		<link rel="stylesheet" href="css/main.css">
		<style>
			/* Prevent layout shifts by hiding app until upgraded and ready */
			body { margin: 0; padding: 0; overflow: hidden; }
			nui-app:not(.nui-ready) { display: none; }
			nui-loading:not(.active) { display: none; }
		</style>
		<script type="module" src="js/main.js"></script>
	</head>
	<body>
		<!-- Loading indicator (bar mode - top of page) -->
		<nui-loading mode="bar"></nui-loading>
		
		<nui-app content-min-width="60rem" content-width="60rem">
			<!-- Skip links for keyboard accessibility (auto-generated for nui-app structure) -->
			<nui-skip-links></nui-skip-links>

            <nui-app-header>
                <div slot="left">
                    <nui-button variant="icon">
                        <button type="button" data-action="toggle-sidebar" aria-label="Toggle navigation">
                            <nui-icon name="menu">☰</nui-icon>
                        </button>
                    </nui-button>
                    <h1>NUI Playground</h1>
                </div>
                <div slot="center">
                    <!-- Example empty center slot -->
                </div>
                <div slot="right">
                    <nui-button variant="icon">
                        <button type="button" data-action="toggle-theme" aria-label="Toggle color scheme">
                            <nui-icon name="brightness">⛭</nui-icon>
                        </button>
                    </nui-button>
                    <nui-button variant="icon" data-notify-badge>
                        <button type="button" aria-label="Notifications">
                            <nui-icon name="notifications">🔔</nui-icon>
                        </button>
                    </nui-button>
                    <nui-popover aria-label="Notifications" placement="bottom">
                        <nui-notification-log></nui-notification-log>
                    </nui-popover>
                    <nui-button variant="icon">
                        <button type="button" data-action="toggle-sidebar:right" aria-label="Toggle settings panel">
                            <nui-icon name="settings">⚙</nui-icon>
                        </button>
                    </nui-button>
                </div>
            </nui-app-header>

            <nui-sidebar behavior="primary">
                <nui-link-list mode="fold">
                    <!-- Navigation loaded from JSON via JavaScript -->
                </nui-link-list>
            </nui-sidebar>

            <nui-sidebar position="right" behavior="manual">
                <div class="demo-config" data-narration-settings>
                    <h3>Narration voice</h3>
                    <p class="demo-config-hint">Every <code>preset=narration</code> block is spoken by the browser. The library picks a sensible default; choose a voice here to override it for the whole demo.</p>

                    <div class="demo-config-field">
                        <label class="demo-config-label" for="tts-voice">Voice</label>
                        <nui-select id="tts-voice" size="small"><select></select></nui-select>
                        <p class="demo-config-hint" data-tts-note hidden></p>
                    </div>

                    <div class="demo-config-field">
                        <label class="demo-config-label" for="tts-rate">
                            <span>Rate</span>
                            <span class="demo-config-value" data-tts-rate>1.00×</span>
                        </label>
                        <nui-slider>
                            <input id="tts-rate" type="range" min="0.5" max="1.5" step="0.05" value="1">
                        </nui-slider>
                    </div>

                    <div class="demo-config-actions">
                        <nui-button variant="outline" size="small">
                            <button type="button" data-tts-preview>Preview</button>
                        </nui-button>
                        <nui-button size="small">
                            <button type="button" data-tts-apply>Use voice</button>
                        </nui-button>
                    </div>

                    <nui-button variant="ghost" size="small">
                        <button type="button" data-tts-reset>Reset to default</button>
                    </nui-button>

                    <p class="demo-config-status" data-tts-status aria-live="polite"></p>
                </div>
            </nui-sidebar>

            <nui-content>
                <nui-main>
                    <!-- Content pages loaded here -->
                </nui-main>
            
               <!-- <nui-content-footer>
                    <footer>
                        <layout>
                            <item>
                                <h1>NUI Component Playground</h1>
                            </item>
                            <item>
                                <p>&copy; 2025 NUI Playground. All rights reserved.</p>
                            </item>
                        </layout>
                    </footer>
                </nui-content-footer>-->
            </nui-content>
            <nui-app-footer>
                <div id="appFooterInfo">...</div>
                <nui-button class="icon-only" data-action="scroll-to-top" id="scrollToTop">
                    <button type="button" aria-label="Scroll to top">
                        Top<nui-icon name="arrow" style="transform: rotate(-90deg)"></nui-icon>
                    </button>
                </nui-button>
            </nui-app-footer>
		</nui-app>
	</body>
</html>
